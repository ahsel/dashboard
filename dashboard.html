<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дашборд заказов</title>
<script src="https://unpkg.com/vue@3.4.31/dist/vue.global.prod.js"></script>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --border: #e4e7ec;
    --text: #1a2233;
    --text-muted: #6b7280;
    --accent: #2f6fed;
    --accent-soft: #e8f0ff;
    --orange: #ff7a45;
    --teal: #2bb3a3;
    --radius: 12px;
    --shadow: 0 1px 3px rgba(16,24,40,0.06), 0 1px 2px rgba(16,24,40,0.04);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  #app { max-width: 1400px; margin: 0 auto; padding: 20px 24px 60px; }
  h1.dash-title { font-size: 22px; font-weight: 700; margin: 0 0 4px; }
  .dash-subtitle { color: var(--text-muted); font-size: 13px; margin: 0 0 20px; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 16px 18px;
  }
  .panel-title {
    font-size: 14px;
    font-weight: 600;
    margin: 0 0 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
  }
  .panel-title .hint { font-size: 11px; font-weight: 400; color: var(--text-muted); }
  .grid {
    display: grid;
    gap: 16px;
  }
  .kpi-row { grid-template-columns: repeat(4, 1fr); margin-bottom: 16px; }
  .main-grid { grid-template-columns: 2fr 1fr; margin-bottom: 16px; }
  .secondary-grid { grid-template-columns: 1.3fr 1fr; margin-bottom: 16px; }
  @media (max-width: 980px) {
    .kpi-row { grid-template-columns: repeat(2, 1fr); }
    .main-grid, .secondary-grid { grid-template-columns: 1fr; }
  }

  /* KPI cards */
  .kpi-card { display: flex; flex-direction: column; gap: 6px; }
  .kpi-label { font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 4px; }
  .kpi-value { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
  .kpi-sub { font-size: 11px; color: var(--text-muted); }
  .info-dot {
    display: inline-flex; align-items: center; justify-content: center;
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--border); color: var(--text-muted);
    font-size: 10px; font-weight: 700; cursor: help;
  }

  /* Toolbar / toggles */
  .toggle-group { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .toggle-group button {
    border: none; background: var(--panel); color: var(--text-muted);
    font-size: 12px; padding: 5px 10px; cursor: pointer;
  }
  .toggle-group button.active { background: var(--accent); color: #fff; }
  .toggle-group button + button { border-left: 1px solid var(--border); }
  .reset-link {
    font-size: 11px; color: var(--accent); cursor: pointer; background: none; border: none; padding: 0;
  }
  .reset-link:hover { text-decoration: underline; }

  /* Chart containers */
  .chart-el { width: 100%; }
  .chart-el svg { display: block; width: 100%; overflow: visible; }
  .axis path.domain, .axis line { stroke: var(--border); }
  .axis text { fill: var(--text-muted); font-size: 10px; }

  .brush .selection { fill: var(--accent); fill-opacity: 0.12; stroke: var(--accent); stroke-opacity: 0.5; }
  .brush .handle { fill: var(--accent); }

  .trend-area { fill: var(--accent); fill-opacity: 0.15; }
  .trend-line { fill: none; stroke: var(--accent); stroke-width: 2; }

  .bar-row { cursor: pointer; }
  .bar-row .track { fill: transparent; }
  .bar-row:hover .track { fill: rgba(0,0,0,0.02); }
  .bar-row .emoji-bg { pointer-events: none; }
  .bar-row .bar-value-label { font-size: 11px; fill: var(--text); font-weight: 600; }
  .bar-row .bar-cat-label { font-size: 12px; fill: var(--text); }
  .bar-row .bar-cat-label.dim { fill: var(--text-muted); }

  .stream-layer { stroke: rgba(0,0,0,0.06); stroke-width: 1; }
  .stream-hover-col { fill: transparent; }

  .yoy-line { fill: none; stroke-width: 2.5; }
  .yoy-dot { stroke: #fff; stroke-width: 1.5; pointer-events: none; }
  .yoy-guide-line { stroke: var(--text-muted); stroke-width: 1; stroke-dasharray: 3 3; pointer-events: none; }

  .floating-tooltip {
    position: fixed;
    pointer-events: none;
    background: #1a2233;
    color: #fff;
    font-size: 12px;
    line-height: 1.5;
    padding: 8px 10px;
    border-radius: 8px;
    box-shadow: var(--shadow);
    z-index: 1000;
    max-width: 260px;
    white-space: pre-line;
  }

  /* Top products */
  .top-product-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: 12px; }
  .top-product-rank { width: 16px; color: var(--text-muted); font-weight: 600; flex-shrink: 0; }
  .top-product-name {
    /* Fixed basis (not `auto`) so every row's name column ends at the same x position —
       with `auto` a long name could steal space from the bar-track below it, misaligning
       the progress bars/values between rows instead of keeping them on a shared grid. */
    flex: 0 0 180px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .top-product-bar-track { flex: 1 1 auto; height: 6px; background: var(--accent-soft); border-radius: 3px; overflow: hidden; }
  .top-product-bar-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.3s ease; }
  .top-product-value { width: 76px; text-align: right; flex-shrink: 0; font-variant-numeric: tabular-nums; color: var(--text-muted); }

  /* Category filter list */
  .cat-filter-list { display: flex; flex-direction: column; gap: 2px; }
  .cat-filter-item {
    display: flex; align-items: center; gap: 8px; padding: 5px 4px; border-radius: 6px;
    cursor: pointer; font-size: 12px; user-select: none;
  }
  .cat-filter-item:hover { background: var(--bg); }
  .cat-filter-item input { accent-color: var(--accent); }
  .cat-filter-item .emoji { font-size: 14px; }
  .cat-filter-item .name { flex: 1 1 auto; }
  .cat-filter-item .amount { color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .cat-filter-item.disabled { opacity: 0.45; }
  .cat-filter-actions { display: flex; gap: 10px; margin-top: 8px; }
  .cat-filter-actions button {
    font-size: 11px; border: 1px solid var(--border); background: var(--panel);
    border-radius: 6px; padding: 4px 8px; cursor: pointer; color: var(--text-muted);
  }
  .cat-filter-actions button:hover { color: var(--text); border-color: var(--accent); }

  /* Table */
  table.orders-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.orders-table th {
    text-align: left; font-weight: 600; color: var(--text-muted);
    padding: 8px 10px; border-bottom: 1px solid var(--border); cursor: pointer; white-space: nowrap;
  }
  table.orders-table th.sorted { color: var(--accent); }
  table.orders-table td { padding: 8px 10px; border-bottom: 1px solid var(--border); }
  table.orders-table tr.order-row { cursor: pointer; }
  table.orders-table tr.order-row:hover td { background: var(--bg); }
  .status-badge {
    display: inline-block; font-size: 11px; padding: 2px 7px; border-radius: 999px;
    background: #e9f9ee; color: #1a7f45;
  }
  .expand-caret {
    display: inline-block; color: var(--text-muted); font-size: 10px;
    transition: transform 0.15s ease; transform-origin: center;
  }
  .expand-caret.open { transform: rotate(90deg); color: var(--accent); }
  tr.order-detail-row td { padding: 0 10px 14px 34px; background: var(--bg); border-bottom: 1px solid var(--border); }
  table.order-items-table { width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 6px; }
  table.order-items-table th {
    text-align: left; font-weight: 600; color: var(--text-muted);
    padding: 5px 8px; border-bottom: 1px solid var(--border); cursor: default; white-space: nowrap;
  }
  table.order-items-table td { padding: 5px 8px; border-bottom: 1px solid var(--border); background: var(--panel); }
  table.order-items-table tr:last-child td { border-bottom: none; }
  .partial-note { font-size: 10px; color: var(--text-muted); }
  .table-footer {
    display: flex; align-items: center; justify-content: space-between; margin-top: 10px; font-size: 12px;
  }
  .table-footer button {
    border: 1px solid var(--border); background: var(--panel); border-radius: 6px;
    padding: 4px 10px; cursor: pointer;
  }
  .table-footer button:disabled { opacity: 0.4; cursor: not-allowed; }
  .table-pager { display: flex; align-items: center; gap: 8px; }

  .empty-state { color: var(--text-muted); font-size: 13px; text-align: center; padding: 24px 0; }

  .yoy-select { font-size: 12px; border: 1px solid var(--border); border-radius: 6px; padding: 3px 6px; }

  /* Date range filter (DataLens-style popover) */
  .date-filter { position: relative; display: inline-block; }
  .date-filter-field {
    display: flex; align-items: center; gap: 8px;
    border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 12px; background: var(--panel); cursor: pointer;
    font-size: 13px; min-width: 220px; justify-content: space-between;
  }
  .date-filter-field:hover { border-color: var(--accent); }
  .date-filter-field .clear-btn {
    border: none; background: none; color: var(--text-muted); cursor: pointer; font-size: 14px;
    line-height: 1; padding: 0 2px;
  }
  .date-filter-field .clear-btn:hover { color: var(--text); }
  .date-filter-popover {
    position: absolute; z-index: 50; top: calc(100% + 6px); left: 0;
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: 0 8px 24px rgba(16,24,40,0.12); padding: 14px; width: 320px;
  }
  .date-filter-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 10px; }
  .date-filter-tabs button {
    border: none; background: none; font-size: 13px; padding: 6px 10px; cursor: pointer;
    color: var(--text-muted); border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .date-filter-tabs button.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
  .date-filter-presets {
    display: flex; gap: 6px; background: var(--bg); border-radius: 8px; padding: 6px; margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .date-filter-presets button {
    flex: 1 1 auto; border: none; background: none; font-size: 12px; color: var(--text-muted);
    padding: 5px 8px; border-radius: 6px; cursor: pointer; white-space: nowrap;
  }
  .date-filter-presets button:hover { background: var(--panel); color: var(--text); }
  .date-filter-presets button.active { background: var(--panel); color: var(--accent); font-weight: 600; box-shadow: var(--shadow); }
  .date-filter-month-nav {
    display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 10px; font-size: 13px; font-weight: 600;
  }
  .date-filter-month-nav button {
    border: none; background: none; cursor: pointer; color: var(--text-muted); font-size: 14px; padding: 2px 6px; border-radius: 6px;
  }
  .date-filter-month-nav button:hover { background: var(--bg); color: var(--text); }
  .date-filter-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; text-align: center; }
  .date-filter-grid .dow { font-size: 10px; color: var(--text-muted); padding: 4px 0; }
  .date-filter-day {
    font-size: 12px; padding: 6px 0; border-radius: 6px; cursor: pointer; color: var(--text);
  }
  .date-filter-day:hover { background: var(--accent-soft); }
  .date-filter-day.weekend { color: var(--orange); }
  .date-filter-day.empty { cursor: default; }
  .date-filter-day.in-range { background: var(--accent-soft); border-radius: 0; }
  .date-filter-day.range-start { background: var(--accent); color: #fff; border-radius: 6px 0 0 6px; }
  .date-filter-day.range-end { background: var(--accent); color: #fff; border-radius: 0 6px 6px 0; }
  .date-filter-day.range-start.range-end { border-radius: 6px; }
  .date-filter-footer {
    display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border);
  }
  .date-filter-footer button {
    font-size: 12px; border: 1px solid var(--border); background: var(--panel); border-radius: 6px;
    padding: 6px 12px; cursor: pointer;
  }
  .date-filter-footer button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
</style>
</head>

<script>
const { createApp, reactive, computed, ref, watch, onMounted, provide, inject, nextTick } = Vue;

/* ---------- Constants ---------- */

const CATEGORY_EMOJI = {
  'Готовая еда': '🍱',
  'Сладости': '🍬',
  'Снеки': '🍿',
  'Напитки': '🥤',
  'Фрукты': '🍎',
  'Услуги Лавки': '🚚',
  'Аптека': '💊',
  'База': '🧈',
  'Вода': '💧',
  'Овощи': '🥦',
  'Товары для дома': '🧽',
};
const ALL_CATEGORIES = Object.keys(CATEGORY_EMOJI);

const CATEGORY_COLORS = [
  '#4DA2F1', '#FF3D64', '#8AD554', '#FFC636', '#FFB9DD',
  '#84D1EE', '#FF91A1', '#54A520', '#DB9100', '#BA74B3',
  '#1F68A9',
];
const categoryColor = (() => {
  const totals = {};
  RAW_ROWS.forEach((r) => {
    if (r.status !== 'delivered') return;
    totals[r.category] = (totals[r.category] || 0) + r.sum;
  });
  const order = ALL_CATEGORIES.slice().sort((a, b) => (totals[b] || 0) - (totals[a] || 0));
  const map = {};
  order.forEach((cat, i) => { map[cat] = CATEGORY_COLORS[i % CATEGORY_COLORS.length]; });
  return map;
})();

// Darken a hex color by a fixed amount — used so the outline icon pattern on each bar
// reads as "a darker shade of this exact bar color" (per spec) rather than an unrelated
// fixed gray, which would look like a print defect rather than an intentional doodle tint.
function darkenHex(hex, amount) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.max(0, ((n >> 16) & 0xff) * (1 - amount));
  const g = Math.max(0, ((n >> 8) & 0xff) * (1 - amount));
  const b = Math.max(0, (n & 0xff) * (1 - amount));
  const toHex = (v) => Math.round(v).toString(16).padStart(2, '0');
  return '#' + toHex(r) + toHex(g) + toHex(b);
}
const categoryIconStroke = (() => {
  const map = {};
  for (const cat of ALL_CATEGORIES) map[cat] = darkenHex(categoryColor[cat], 0.35);
  return map;
})();

// Deterministic PRNG (mulberry32) seeded from a string hash — used to build the bar-chart
// collage layouts below. Deterministic-but-random: the same category always gets the same
// scattered arrangement (no jitter/reshuffle on every re-render or filter toggle), while
// different categories look nothing alike.
function hashString(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (Math.imul(31, h) + s.charCodeAt(i)) | 0;
  return h;
}
function mulberry32(seed) {
  let a = seed;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const RU_MONTHS_SHORT = ['янв', 'фев', 'мар', 'апр', 'май', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
const RU_MONTHS_FULL = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];

const fmtMoney = (v) => new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 0 }).format(Math.round(v || 0)) + ' ₽';
const fmtNum = (v) => new Intl.NumberFormat('ru-RU').format(Math.round(v || 0));
const fmtMonthRu = (date) => RU_MONTHS_SHORT[date.getUTCMonth()] + ' ' + date.getUTCFullYear();
const monthStart = (dateStr) => {
  const d = new Date(dateStr + 'T00:00:00Z');
  return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1);
};
const dayStart = (dateStr) => {
  const d = new Date(dateStr + 'T00:00:00Z');
  return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
};
const addDays = (ts, n) => ts + n * 86400000;
const fmtDateRu = (ts) => {
  const d = new Date(ts);
  return String(d.getUTCDate()).padStart(2, '0') + '.' + String(d.getUTCMonth() + 1).padStart(2, '0') + '.' + d.getUTCFullYear();
};

/* ---------- Store ---------- */

function createStore() {
  const allRows = RAW_ROWS;

  const minDay = d3.min(allRows, (r) => dayStart(r.date));
  const maxDay = d3.max(allRows, (r) => dayStart(r.date));

  const state = reactive({
    dateRange: { start: minDay, end: maxDay }, // inclusive day-start timestamps
    selectedCategories: new Set(ALL_CATEGORIES),
    barChartMetric: 'sum', // 'sum' | 'qty'
    topProductsMetric: 'sum',
    yoyYearA: 2021,
    yoyYearB: 2026,
    table: { page: 1, pageSize: 20, sortKey: 'date', sortDir: 'desc' },
  });

  const fullRange = { start: minDay, end: maxDay };

  const deliveredRows = computed(() => allRows.filter((r) => r.status === 'delivered'));

  const categoryFilteredRows = computed(() =>
    deliveredRows.value.filter((r) => state.selectedCategories.has(r.category))
  );

  const inRange = (row) => {
    const d = dayStart(row.date);
    return d >= state.dateRange.start && d <= state.dateRange.end;
  };

  const filteredRows = computed(() => categoryFilteredRows.value.filter(inRange));

  const availableYears = computed(() => {
    const years = new Set(deliveredRows.value.map((r) => Number(r.date.slice(0, 4))));
    return Array.from(years).sort((a, b) => a - b);
  });

  function toggleCategory(cat) {
    if (state.selectedCategories.has(cat)) {
      if (state.selectedCategories.size === 1) return; // keep at least one? no — allow 0, handled by empty states
      state.selectedCategories.delete(cat);
    } else {
      state.selectedCategories.add(cat);
    }
  }
  function setAllCategories(on) {
    state.selectedCategories = new Set(on ? ALL_CATEGORIES : []);
  }
  function resetDateRange() {
    state.dateRange = { start: fullRange.start, end: fullRange.end };
  }

  return {
    state, allRows, deliveredRows, categoryFilteredRows, filteredRows,
    fullRange, availableYears, toggleCategory, setAllCategories, resetDateRange,
  };
}

/* ---------- KPI computations ---------- */

function useKpis(store) {
  const kpis = computed(() => {
    const rows = store.filteredRows.value;
    const orders = new Set(rows.map((r) => r.order));
    const ordersCount = orders.size;
    const totalSum = d3.sum(rows, (r) => r.sum);
    const avgCheck = ordersCount > 0 ? totalSum / ordersCount : 0;
    const baseWeighted = d3.sum(rows, (r) => r.priceBase * r.qty);
    const discountWeighted = d3.sum(rows, (r) => r.discount * r.qty);
    const avgDiscountPct = baseWeighted > 0 ? (discountWeighted / baseWeighted) * 100 : 0;
    return { ordersCount, totalSum, avgCheck, avgDiscountPct, hasData: rows.length > 0 };
  });
  return { kpis };
}

/* ---------- KPI Cards component ---------- */

const KpiCards = {

        </div>
        <div class="kpi-value">{{ kpis.hasData ? kpis.avgDiscountPct.toFixed(1) + '%' : '—' }}</div>
      </div>
    </div>
  `,
};

const DateRangeFilter = {
  props: { dateRange: Object, fullRange: Object },
  emits: ['change'],
  setup(props, { emit }) {
    const open = ref(false);
    const rootEl = ref(null);
    const activeTab = ref('День');
    const activePreset = ref(null); // days count, or null if custom/calendar-picked

    // draft selection while the popover is open — committed to parent only on "Применить"
    const pickStart = ref(props.dateRange.start);
    const pickEnd = ref(props.dateRange.end);
    const pendingClickStart = ref(null); // first click of a two-click range pick, before second click

    const viewMonth = ref((() => {
      const d = new Date(props.dateRange.end);
      return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1);
    })());

    function openPopover() {
      pickStart.value = props.dateRange.start;
      pickEnd.value = props.dateRange.end;
      pendingClickStart.value = null;
      const d = new Date(props.dateRange.end);
      viewMonth.value = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1);
      open.value = true;
    }
    function closePopover() { open.value = false; }

    function onDocClick(e) {
      if (open.value && rootEl.value && !rootEl.value.contains(e.target)) closePopover();
    }
    onMounted(() => document.addEventListener('mousedown', onDocClick));

    function applyPreset(days) {
      activePreset.value = days;
      pickEnd.value = props.fullRange.end;
      pickStart.value = Math.max(props.fullRange.start, addDays(props.fullRange.end, -(days - 1)));
      pendingClickStart.value = null;
    }

    function pickDay(ts) {
      activePreset.value = null;
      if (pendingClickStart.value === null) {
        pendingClickStart.value = ts;
        pickStart.value = ts;
        pickEnd.value = ts;
      } else {
        const a = pendingClickStart.value, b = ts;
        pickStart.value = Math.min(a, b);
        pickEnd.value = Math.max(a, b);
        pendingClickStart.value = null;
      }
    }

    function applyAndClose() {
      emit('change', { start: pickStart.value, end: pickEnd.value });
      closePopover();
    }
    function resetAll() {
      pickStart.value = props.fullRange.start;
      pickEnd.value = props.fullRange.end;
      activePreset.value = null;
      pendingClickStart.value = null;
    }
    function clearToFull() {
      emit('change', { start: props.fullRange.start, end: props.fullRange.end });
      closePopover();
    }

    function shiftMonth(delta) {
      const d = new Date(viewMonth.value);
      viewMonth.value = Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + delta, 1);
    }
    function shiftYear(delta) {
      const d = new Date(viewMonth.value);
      viewMonth.value = Date.UTC(d.getUTCFullYear() + delta, d.getUTCMonth(), 1);
    }

    const viewYear = computed(() => new Date(viewMonth.value).getUTCFullYear());
    const viewMonthLabel = computed(() => RU_MONTHS_FULL[new Date(viewMonth.value).getUTCMonth()]);

    const calendarDays = computed(() => {
      const d = new Date(viewMonth.value);
      const year = d.getUTCFullYear(), month = d.getUTCMonth();
      const firstDow = (new Date(Date.UTC(year, month, 1)).getUTCDay() + 6) % 7; // Mon=0
      const daysInMonth = new Date(Date.UTC(year, month + 1, 0)).getUTCDate();
      const cells = [];
      for (let i = 0; i < firstDow; i++) cells.push(null);
      for (let day = 1; day <= daysInMonth; day++) cells.push(Date.UTC(year, month, day));
      return cells;
    });

    function dayClass(ts) {
      if (ts === null) return 'empty';
      const classes = [];
      const dow = (new Date(ts).getUTCDay() + 6) % 7;
      if (dow >= 5) classes.push('weekend');
      if (ts >= pickStart.value && ts <= pickEnd.value) classes.push('in-range');
      if (ts === pickStart.value) classes.push('range-start');
      if (ts === pickEnd.value) classes.push('range-end');
      return classes.join(' ');
    }

    const fieldLabel = computed(() => {
      const r = props.dateRange;
      if (r.start === props.fullRange.start && r.end === props.fullRange.end) return 'Весь период';
      return fmtDateRu(r.start) + ' – ' + fmtDateRu(r.end);
    });
    const isFullRange = computed(() => props.dateRange.start === props.fullRange.start && props.dateRange.end === props.fullRange.end);

    return {
      open, rootEl, activeTab, activePreset, pickStart, pickEnd,
      viewMonth, viewYear, viewMonthLabel, calendarDays, dayClass,
      fieldLabel, isFullRange,
      PRESETS, GRANULARITY_TABS, RU_DOW,
      openPopover, closePopover, applyPreset, pickDay, applyAndClose, resetAll, clearToFull,
      shiftMonth, shiftYear, fmtDateRu,
    };
  },
  template: `
    <div class="date-filter" ref="rootEl">
      <div class="date-filter-field" @click="openPopover">
        <span>{{ fieldLabel }}</span>
        <button v-if="!isFullRange" class="clear-btn" @click.stop="clearToFull" title="Сбросить">✕</button>
      </div>
      <div v-if="open" class="date-filter-popover">
        <div class="date-filter-tabs">
          <button v-for="t in GRANULARITY_TABS" :key="t" :class="{ active: activeTab === t }" @click="activeTab = t">{{ t }}</button>
        </div>
        <div class="date-filter-presets">
          <button v-for="p in PRESETS" :key="p.days" :class="{ active: activePreset === p.days }" @click="applyPreset(p.days)">{{ p.label }}</button>
        </div>
        <div class="date-filter-month-nav">
          <button @click="shiftYear(-1)">«</button>
          <button @click="shiftMonth(-1)">‹</button>
          <span>{{ viewMonthLabel }} {{ viewYear }}</span>
          <button @click="shiftMonth(1)">›</button>
          <button @click="shiftYear(1)">»</button>
        </div>
        <div class="date-filter-grid">
          <div class="dow" v-for="d in RU_DOW" :key="d">{{ d }}</div>
          <div
            v-for="(ts, i) in calendarDays" :key="i"
            class="date-filter-day" :class="dayClass(ts)"
            @click="ts !== null && pickDay(ts)"
          >{{ ts !== null ? new Date(ts).getUTCDate() : '' }}</div>
        </div>
        <div class="date-filter-footer">
          <button @click="resetAll">Сбросить</button>
          <button class="primary" @click="applyAndClose">Применить</button>
        </div>
      </div>
    </div>
  `,
};

/* ---------- Category bar chart (emoji background) ---------- */

const CategoryBarChart = {
  props: { dateFilteredRows: Array, selectedCategories: Set, metric: String },
  emits: ['toggle-category', 'update:metric'],
  setup(props, { emit }) {
    const el = ref(null);

    const data = computed(() => {
      const sumByCat = {}, qtyByCat = {};
      ALL_CATEGORIES.forEach((c) => { sumByCat[c] = 0; qtyByCat[c] = 0; });
      props.dateFilteredRows.forEach((r) => {
        sumByCat[r.category] += r.sum;
        qtyByCat[r.category] += r.qty;
      });
      const metric = props.metric;
      const rows = ALL_CATEGORIES.map((cat) => ({
        category: cat,
        sum: sumByCat[cat],
        qty: qtyByCat[cat],
        value: metric === 'sum' ? sumByCat[cat] : qtyByCat[cat],
        selected: props.selectedCategories.has(cat),
      }));
      rows.sort((a, b) => b.value - a.value);
      return rows;
    });

    // Seamless outline scatter pattern inside a bar of width `barW` x height
    // `rowContentH`, matching the packaging-doodle reference: single-color stroke icons
    // (no fill), uniform-ish small size, fairly even density, no grid/rows/clusters/big
    // cropped accents. Placement uses Poisson-disc-style dart-throwing — pick a random
    // candidate point, reject it if it's too close to any already-placed icon (distance
    // threshold scales with both icons' sizes, not a fixed radius), keep going until
    // either the target area coverage (20-30%) is hit or 200 consecutive placements fail.
    // Margin equal to one icon's radius is added on all sides so icons placed near an
    // edge still get the usual "partly cropped by the bar's own clip" look instead of an
    // artificial empty halo band — exactly what "бесшовно при обрезании" calls for.
    // Seeded purely by category name (mulberry32): identical category+barW always
    // reproduces the same arrangement, independent of resize/re-render timing.
    function collageItems(barW, rowContentH, category) {
      const icons = CATEGORY_LINE_ICONS[category] || [];
      if (icons.length === 0 || barW <= 0) return [];
      const rng = mulberry32(hashString(category));

      const SIZE_MIN = 16, SIZE_MAX = 26; // slightly smaller than before so more instances fit at the same density
      const MIN_GAP = 3 + rng() * 2; // 3-5px — tighter than before to allow denser packing
      const MARGIN = SIZE_MAX / 2; // icons may start partly off-bar, matching "бесшовно при обрезании"

      // `targetCount` here is just a generous SAFETY CAP, not the actual stopping
      // condition — the previous version used it as a hard stop, which cut placement
      // short before the bar was actually saturated (that's what produced the uneven
      // "Услуги Лавки"-style big empty gap and the under-filled short bars like "Товары
      // для дома"/"Овощи": their natural targetCount was tiny, e.g. 1-2, so the loop quit
      // almost immediately even though plenty of room was still free). Real termination
      // is `consecutiveFailures` below — i.e. actually pack until no more icons fit.
      const targetCoverage = 0.45 + rng() * 0.15; // aim higher; cap below still allows reaching true saturation
      const avgIconArea = ((SIZE_MIN + SIZE_MAX) / 2) ** 2 * 0.5; // ~0.5 fill factor for a sparse line-icon glyph
      const targetArea = barW * rowContentH * targetCoverage;
      const targetCount = Math.max(4, Math.round((targetArea / avgIconArea) * 2.5));

      let lastIconIdx = -1;
      function pickIcon() {
        if (icons.length === 1) return 0;
        let idx;
        do { idx = Math.floor(rng() * icons.length); } while (idx === lastIconIdx);
        lastIconIdx = idx;
        return idx;
      }

      // 200 consecutive misses was tuned for the old (lower) density target — at true
      // saturation, especially on small bars with little free area left, dart-throwing
      // needs many more wasted tries before concluding "no more icons fit" is actually
      // true rather than just unlucky. Scaling the patience with icon count prevents the
      // loop from giving up early on short bars (few icons fit total, so a fixed 200
      // reads as "basically give up after the first handful").
      const maxConsecutiveFailures = 400;
      const placed = []; // {cx, cy, r}
      const items = [];
      let consecutiveFailures = 0;

      while (items.length < targetCount && consecutiveFailures < maxConsecutiveFailures) {
        const size = SIZE_MIN + rng() * (SIZE_MAX - SIZE_MIN);
        const r = size / 2;
        const cx = -MARGIN + rng() * (barW + 2 * MARGIN);
        const cy = -MARGIN + rng() * (rowContentH + 2 * MARGIN);

        const collides = placed.some((p) => {
          const minDist = p.r + r + MIN_GAP;
          return Math.hypot(cx - p.cx, cy - p.cy) < minDist;
        });

        if (collides) {
          consecutiveFailures++;
          continue;
        }

        consecutiveFailures = 0;
        placed.push({ cx, cy, r });
        const iconIdx = pickIcon();
        const rotation = rng() * 360;
        const opacity = 0.26 + rng() * 0.14; // raised from 0.18-0.28 for more visible contrast
        items.push({ iconIdx, cx, cy, size, rotation, opacity, z: rng() });
      }

      items.sort((a, b) => a.z - b.z);
      return items;
    }

    function render() {
      const container = el.value;
      if (!container) return;
      const rows = data.value;
      // Just tall enough for the 18-28px outline icons to sit at roughly their natural
      // size (icon placement is Poisson-disc over the full bar area now, not split into
      // sub-rows, so this no longer needs to accommodate multiple icon rows stacked
      // vertically — narrower reads as a tighter, more packaging-label-like strip).
      const rowH = 46;
      const rowContentH = rowH - 6;
      const margin = { top: 4, right: 56, bottom: 4, left: 120 };
      const width = container.clientWidth || 500;
      const innerW = width - margin.left - margin.right;
      const height = rows.length * rowH + margin.top + margin.bottom;

      let svg = d3.select(container).select('svg');
      if (svg.empty()) {
        svg = d3.select(container).append('svg');
        svg.append('g').attr('class', 'bars-root').attr('transform', `translate(${margin.left},${margin.top})`);
      }
      svg.attr('viewBox', [0, 0, width, height]).attr('height', height);
      const g = svg.select('.bars-root');

      const maxVal = d3.max(rows, (d) => d.value) || 1;
      const x = d3.scaleLinear().domain([0, maxVal]).range([0, innerW]);
      const yPos = {};
      rows.forEach((d, i) => { yPos[d.category] = i * rowH; });

      const fmtVal = (d) => props.metric === 'sum' ? fmtMoney(d.value) : fmtNum(d.value) + ' шт';
      const clipId = (cat) => 'clip-bar-' + cat.replace(/\s+/g, '-');

      const join = g.selectAll('g.bar-row').data(rows, (d) => d.category);

      const enter = join.enter().append('g')
        .attr('class', 'bar-row')
        .attr('transform', (d) => `translate(0,${yPos[d.category]})`)
        .style('opacity', 0);

      enter.append('rect').attr('class', 'track').attr('width', innerW).attr('height', rowContentH);

      // Bar fill is now fully opaque — the illustrations live ON TOP of it (clipped to the
      // bar's own width), instead of the old approach of a semi-transparent bar over a
      // full-row emoji layer, which is exactly what made the pictures read as barely visible.
      enter.append('rect')
        .attr('class', 'bar-value-rect')
        .attr('height', rowContentH)
        .attr('rx', 4)
        .attr('fill', (d) => categoryColor[d.category])
        .attr('width', 0);

      enter.append('clipPath')
        .attr('id', (d) => clipId(d.category))
        .append('rect')
        .attr('height', rowContentH).attr('rx', 4)
        .attr('width', 0);

      enter.append('g')
        .attr('class', 'bar-images')
        .attr('clip-path', (d) => `url(#${clipId(d.category)})`);

      enter.append('text')
        .attr('class', 'bar-cat-label')
        .attr('x', -10).attr('y', rowContentH / 2 + 4)
        .attr('text-anchor', 'end')
        .text((d) => d.category);

      enter.append('text')
        .attr('class', 'bar-value-label')
        .attr('y', rowContentH / 2 + 4)
        .text(fmtVal);

      enter.append('title').text((d) => `${d.category}: ${fmtVal(d)}`);

      enter.on('click', (event, d) => emit('toggle-category', d.category));

      const merged = enter.merge(join);
      merged.transition().duration(350)
        .attr('transform', (d) => `translate(0,${yPos[d.category]})`)
        .style('opacity', (d) => d.selected ? 1 : 0.4);

      merged.select('.bar-cat-label')
        .attr('class', (d) => 'bar-cat-label' + (d.selected ? '' : ' dim'));

      merged.select('.bar-value-rect').transition().duration(350)
        .attr('width', (d) => Math.max(x(d.value), 1));

      // The clip rect's width transitions together with the bar, which makes the tiled
      // illustrations progressively reveal/hide as the bar grows/shrinks — the tiles
      // themselves are positioned at their final target layout (no per-frame re-layout).
      merged.select('clipPath rect').transition().duration(350)
        .attr('width', (d) => Math.max(x(d.value), 1));

      merged.each(function (d) {
        const barW = Math.max(x(d.value), 1);
        const items = collageItems(barW, rowContentH, d.category);
        const icons = CATEGORY_LINE_ICONS[d.category] || [];
        const stroke = categoryIconStroke[d.category];
        const VIEWBOX = 24; // Tabler outline icons are authored on a 24x24 grid

        // Each item is a <g> (translate to position, scale from the 24x24 source grid down
        // to its target px size, rotate around its own center) containing the icon's raw
        // <path> data — a single shared stroke color/width/opacity per item, matching
        // "один цвет... толщина линии одинаковая" rather than per-path styling.
        const itemSel = d3.select(this).select('.bar-images')
          .selectAll('g.scatter-icon')
          .data(items, (t, i) => i);

        const entered = itemSel.enter().append('g').attr('class', 'scatter-icon');
        entered.append('g').attr('class', 'scatter-icon-paths');

        const mergedItems = entered.merge(itemSel);
        mergedItems
          .attr('transform', (t) => {
            const scale = t.size / VIEWBOX;
            return `translate(${t.cx},${t.cy}) rotate(${t.rotation}) scale(${scale}) translate(${-VIEWBOX / 2},${-VIEWBOX / 2})`;
          })
          .attr('opacity', (t) => t.opacity)
          .attr('stroke', stroke)
          .attr('fill', 'none')
          .attr('stroke-width', 2)
          .attr('stroke-linecap', 'round')
          .attr('stroke-linejoin', 'round')
          .style('pointer-events', 'none');

        mergedItems.select('.scatter-icon-paths').each(function (t) {
          const icon = icons[t.iconIdx];
          const pathSel = d3.select(this).selectAll('path').data(icon ? icon.paths : []);
          pathSel.enter().append('path').merge(pathSel).attr('d', (p) => p);
          pathSel.exit().remove();
        });

        itemSel.exit().remove();
      });

      merged.select('.bar-value-label')
        .text(fmtVal)
        .transition().duration(350)
        .attr('x', (d) => Math.max(x(d.value), 1) + 8);

      merged.select('title').text((d) => `${d.category}: ${fmtVal(d)}`);

      join.exit().remove();
    }

    onMounted(() => {
      render();
      const ro = new ResizeObserver(() => render());
      ro.observe(el.value);
    });
    watch([data], () => render());

    return { el };
  },
  template: `<div class="chart-el" ref="el"></div>`,
};

/* ---------- Top products list ---------- */

const TopProducts = {
  props: { rows: Array, metric: String },
  setup(props) {
    const items = computed(() => {
      const sumByName = new Map(), qtyByName = new Map();
      props.rows.forEach((r) => {
        sumByName.set(r.name, (sumByName.get(r.name) || 0) + r.sum);
        qtyByName.set(r.name, (qtyByName.get(r.name) || 0) + r.qty);
      });
      const names = Array.from(sumByName.keys());
      const metric = props.metric;
      const mapped = names.map((name) => ({
        name,
        sum: sumByName.get(name),
        qty: qtyByName.get(name),
        value: metric === 'sum' ? sumByName.get(name) : qtyByName.get(name),
      }));
      mapped.sort((a, b) => b.value - a.value);
      const top = mapped.slice(0, 10);
      const maxVal = top.length ? top[0].value : 1;
      return top.map((d) => ({ ...d, pct: maxVal > 0 ? (d.value / maxVal) * 100 : 0 }));
    });
    const fmtVal = (d) => props.metric === 'sum' ? fmtMoney(d.value) : fmtNum(d.value) + ' шт';
    return { items, fmtVal };
  },
  template: `
    <div v-if="items.length === 0" class="empty-state">Нет данных для текущего фильтра</div>
    <div v-else>
      <div class="top-product-row" v-for="(item, i) in items" :key="item.name">
        <div class="top-product-rank">{{ i + 1 }}</div>
        <div class="top-product-name" :title="item.name">{{ item.name }}</div>
        <div class="top-product-bar-track"><div class="top-product-bar-fill" :style="{ width: item.pct + '%' }"></div></div>
        <div class="top-product-value">{{ fmtVal(item) }}</div>
      </div>
    </div>
  `,
};

/* ---------- Streamgraph ---------- */

const StreamGraph = {
  props: { rows: Array, selectedCategories: Set },
  setup(props) {
    const el = ref(null);
    const tooltip = inject('tooltip');

    const categoryOrderFull = computed(() => Object.keys(categoryColor));

    const pivotData = computed(() => {
      const byMonth = new Map();
      props.rows.forEach((r) => {
        const m = monthStart(r.date);
        if (!byMonth.has(m)) {
          const obj = { month: m };
          ALL_CATEGORIES.forEach((c) => { obj[c] = 0; });
          byMonth.set(m, obj);
        }
        byMonth.get(m)[r.category] += r.sum;
      });
      return Array.from(byMonth.values()).sort((a, b) => a.month - b.month);
    });

    function render() {
      const container = el.value;
      if (!container) return;
      const width = container.clientWidth || 600;
      const height = 280;
      const margin = { top: 10, right: 16, bottom: 46, left: 48 };
      const innerW = width - margin.left - margin.right;
      const innerH = height - margin.top - margin.bottom;

      const keys = categoryOrderFull.value.filter((c) => props.selectedCategories.has(c));
      const data = pivotData.value;

      d3.select(container).selectAll('*').remove();
      if (keys.length === 0 || data.length === 0) {
        d3.select(container).append('div').attr('class', 'empty-state').text('Выберите хотя бы одну категорию');
        return;
      }

      const svg = d3.select(container).append('svg').attr('viewBox', [0, 0, width, height]);
      const g = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);

      const series = d3.stack().keys(keys).order(d3.stackOrderNone).offset(d3.stackOffsetNone)(data);

      const x = d3.scaleUtc().domain(d3.extent(data, (d) => d.month)).range([0, innerW]);
      const yMax = d3.max(series, (s) => d3.max(s, (d) => d[1])) || 1;
      const y = d3.scaleLinear().domain([0, yMax]).nice().range([innerH, 0]);

      const area = d3.area().curve(d3.curveBasis)
        .x((d) => x(d.data.month)).y0((d) => y(d[0])).y1((d) => y(d[1]));

      g.append('g').selectAll('path').data(series, (d) => d.key).join('path')
        .attr('class', 'stream-layer')
        .attr('fill', (d) => categoryColor[d.key])
        .attr('d', area)
        .append('title').text((d) => d.key);

      // "окт 2021"-style labels are ~55px wide at this font size — asking d3 for a fixed
      // tick *count* (the old code's `ticks(10)`) ignores that and overlaps badly on wide
      // date ranges. Instead pick an explicit month step so each label gets enough room,
      // same approach as YoyChart's month axis, and rotate the text as a second safety net.
      const minPxPerTick = 64;
      const monthsInRange = data.length;
      const monthStep = Math.max(1, Math.ceil((monthsInRange * minPxPerTick) / Math.max(innerW, 1)));

      g.append('g').attr('class', 'axis')
        .attr('transform', `translate(0,${innerH})`)
        .call(d3.axisBottom(x).ticks(d3.utcMonth.every(monthStep)).tickFormat(fmtMonthRu))
        .call((sel) => sel.select('.domain').remove())
        .selectAll('text')
        .attr('transform', 'rotate(-40)')
        .attr('text-anchor', 'end')
        .attr('dx', '-0.5em')
        .attr('dy', '0.3em');

      g.append('g').attr('class', 'axis')
        .call(d3.axisLeft(y).ticks(4).tickFormat((d) => d === 0 ? '0' : Math.round(d / 1000) + 'k'))
        .call((sel) => sel.select('.domain').remove());

      // hover columns -> tooltip with per-category breakdown for that month
      const bandEdges = [0];
      const xs = data.map((d) => x(d.month));
      for (let i = 1; i < xs.length; i++) bandEdges.push((xs[i - 1] + xs[i]) / 2);
      bandEdges.push(innerW);

      g.append('g').selectAll('rect.stream-hover-col').data(data).join('rect')
        .attr('class', 'stream-hover-col')
        .attr('x', (d, i) => bandEdges[i])
        .attr('width', (d, i) => Math.max(bandEdges[i + 1] - bandEdges[i], 1))
        .attr('y', 0).attr('height', innerH)
        .on('mousemove', (event, d) => {
          const breakdown = keys
            .map((k) => ({ cat: k, val: d[k] || 0 }))
            .filter((x) => x.val > 0)
            .sort((a, b) => b.val - a.val);
          const total = d3.sum(breakdown, (x) => x.val);
          const lines = [fmtMonthRu(new Date(d.month)) + '  ·  Итого: ' + fmtMoney(total)]
            .concat(breakdown.map((x) => `${CATEGORY_EMOJI[x.cat]} ${x.cat}: ${fmtMoney(x.val)}`));
          tooltip.show(event.clientX, event.clientY, lines.join('\n'));
        })
        .on('mouseleave', () => tooltip.hide());
    }

    onMounted(() => {
      render();
      const ro = new ResizeObserver(() => render());
      ro.observe(el.value);
    });
    watch([pivotData, () => props.selectedCategories], () => render(), { deep: true });

    return { el };
  },
  template: `<div class="chart-el" ref="el" style="min-height:260px;"></div>`,
};

/* ---------- Year-over-year chart ---------- */

const YoyChart = {
  props: { rows: Array, yearA: Number, yearB: Number, availableYears: Array },
  emits: ['update:yearA', 'update:yearB'],
  setup(props, { emit }) {
    const el = ref(null);
    const tooltip = inject('tooltip');

    const seriesData = computed(() => {
      const makeSeries = (year) => {
        const byMonth = new Array(12).fill(0);
        props.rows.forEach((r) => {
          const y = Number(r.date.slice(0, 4));
          if (y !== year) return;
          const m = Number(r.date.slice(5, 7)) - 1;
          byMonth[m] += r.sum;
        });
        return { year, values: byMonth };
      };
      return [makeSeries(props.yearA), makeSeries(props.yearB)];
    });

    const colors = { a: '#ff7a45', b: '#2bb3a3' };

    function render() {
      const container = el.value;
      if (!container) return;
      const width = container.clientWidth || 600;
      const height = 220;
      const margin = { top: 10, right: 16, bottom: 26, left: 48 };
      const innerW = width - margin.left - margin.right;
      const innerH = height - margin.top - margin.bottom;

      d3.select(container).selectAll('*').remove();

      const series = seriesData.value;
      if (props.rows.length === 0) {
        d3.select(container).append('div').attr('class', 'empty-state').text('Нет данных для текущего фильтра');
        return;
      }

      const svg = d3.select(container).append('svg').attr('viewBox', [0, 0, width, height]);
      const g = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);

      const x = d3.scalePoint().domain(d3.range(12)).range([0, innerW]).padding(0.5);
      const yMax = d3.max(series, (s) => d3.max(s.values)) || 1;
      const y = d3.scaleLinear().domain([0, yMax]).nice().range([innerH, 0]);

      const line = d3.line().curve(d3.curveBasis)
        .x((d, i) => x(i)).y((d) => y(d));

      g.append('g').attr('class', 'axis')
        .attr('transform', `translate(0,${innerH})`)
        .call(d3.axisBottom(x).tickFormat((i) => RU_MONTHS_SHORT[i]))
        .call((sel) => sel.select('.domain').remove());

      g.append('g').attr('class', 'axis')
        .call(d3.axisLeft(y).ticks(4).tickFormat((d) => d === 0 ? '0' : Math.round(d / 1000) + 'k'))
        .call((sel) => sel.select('.domain').remove());

      const colorKey = (d, i) => i === 0 ? colors.a : colors.b;

      g.append('g').selectAll('path.yoy-line').data(series, (d) => d.year).join('path')
        .attr('class', 'yoy-line')
        .attr('stroke', (d, i) => colorKey(d, i))
        .attr('d', (d) => line(d.values));

      series.forEach((s, si) => {
        g.append('g').selectAll('circle').data(s.values).join('circle')
          .attr('class', 'yoy-dot')
          .attr('fill', colorKey(s, si))
          .attr('cx', (d, i) => x(i)).attr('cy', (d) => y(d)).attr('r', 3);
      });

      // labels at line end
      series.forEach((s, si) => {
        const lastIdx = s.values.length - 1;
        g.append('text')
          .attr('x', x(lastIdx) + 8).attr('y', y(s.values[lastIdx]) + 4)
          .attr('fill', colorKey(s, si)).attr('font-size', 12).attr('font-weight', 700)
          .text(s.year);
      });

      // Hover guide: a vertical line snapping to the nearest month, with a floating
      // tooltip showing both years' values for that month (replaces the old per-dot
      // <title>, which is a native-browser tooltip — slow to appear, doesn't track the
      // cursor, and only ever shows one series' value at a time).
      const guideLine = g.append('line')
        .attr('class', 'yoy-guide-line')
        .attr('y1', 0).attr('y2', innerH)
        .style('opacity', 0);

      const hoverOverlay = g.append('rect')
        .attr('width', innerW).attr('height', innerH)
        .attr('fill', 'transparent');

      hoverOverlay
        .on('mousemove', (event) => {
          const [mx] = d3.pointer(event);
          // d3.scalePoint has no .invert() — find the nearest month by comparing each
          // tick's x(i) against the cursor position directly.
          let nearest = 0, bestDist = Infinity;
          for (let i = 0; i < 12; i++) {
            const dist = Math.abs(x(i) - mx);
            if (dist < bestDist) { bestDist = dist; nearest = i; }
          }
          guideLine
            .attr('x1', x(nearest)).attr('x2', x(nearest))
            .style('opacity', 1);

          const lines = [RU_MONTHS_FULL[nearest]];
          series.forEach((s) => lines.push(`${s.year}: ${fmtMoney(s.values[nearest])}`));
          tooltip.show(event.clientX, event.clientY, lines.join('\n'));
        })
        .on('mouseleave', () => {
          guideLine.style('opacity', 0);
          tooltip.hide();
        });
    }

    onMounted(() => {
      render();
      const ro = new ResizeObserver(() => render());
      ro.observe(el.value);
    });
    watch(seriesData, () => render());

    return { el };
  },
  template: `
    <div>
      <div style="display:flex; gap:10px; margin-bottom:8px; font-size:12px; align-items:center;">
        <label>Год A: <select class="yoy-select" :value="yearA" @change="$emit('update:yearA', Number($event.target.value))">
          <option v-for="y in availableYears" :key="y" :value="y">{{ y }}</option>
        </select></label>
        <label>Год B: <select class="yoy-select" :value="yearB" @change="$emit('update:yearB', Number($event.target.value))">
          <option v-for="y in availableYears" :key="y" :value="y">{{ y }}</option>
        </select></label>
      </div>
      <div class="chart-el" ref="el" style="height:220px;"></div>
    </div>
  `,
};

/* ---------- Category filter popover (DataLens-style, matches DateRangeFilter) ---------- */

const CategoryFilterPopover = {
  props: { dateFilteredRows: Array, selectedCategories: Set },
  emits: ['toggle-category', 'set-all'],
  setup(props, { emit }) {
    const open = ref(false);
    const rootEl = ref(null);

    function onDocClick(e) {
      if (open.value && rootEl.value && !rootEl.value.contains(e.target)) open.value = false;
    }
    onMounted(() => document.addEventListener('mousedown', onDocClick));

    const sums = computed(() => {
      const map = {};
      ALL_CATEGORIES.forEach((c) => { map[c] = 0; });
      props.dateFilteredRows.forEach((r) => { map[r.category] += r.sum; });
      return map;
    });
    const orderedCats = computed(() =>
      ALL_CATEGORIES.slice().sort((a, b) => sums.value[b] - sums.value[a])
    );

    const selectedCount = computed(() => props.selectedCategories.size);
    const fieldLabel = computed(() => {
      const n = selectedCount.value;
      if (n === ALL_CATEGORIES.length) return 'Все категории';
      if (n === 0) return 'Категории не выбраны';
      return `Выбрано: ${n} из ${ALL_CATEGORIES.length}`;
    });
    const isAllSelected = computed(() => selectedCount.value === ALL_CATEGORIES.length);

    function clearToAll() {
      emit('set-all', true);
    }

    return {
      open, rootEl, sums, orderedCats, CATEGORY_EMOJI, fmtMoney,
      fieldLabel, isAllSelected, clearToAll,
    };
  },
  template: `
    <div class="date-filter" ref="rootEl">
      <div class="date-filter-field" @click="open = !open">
        <span>{{ fieldLabel }}</span>
        <button v-if="!isAllSelected" class="clear-btn" @click.stop="clearToAll" title="Сбросить (выбрать все)">✕</button>
      </div>
      <div v-if="open" class="date-filter-popover" style="width:280px;">
        <div class="cat-filter-list">
          <label class="cat-filter-item" v-for="cat in orderedCats" :key="cat" :class="{ disabled: !selectedCategories.has(cat) }">
            <input type="checkbox" :checked="selectedCategories.has(cat)" @change="$emit('toggle-category', cat)">
            <span class="emoji">{{ CATEGORY_EMOJI[cat] }}</span>
            <span class="name">{{ cat }}</span>
            <span class="amount">{{ fmtMoney(sums[cat]) }}</span>
          </label>
        </div>
        <div class="cat-filter-actions">
          <button @click="$emit('set-all', true)">Выбрать все</button>
          <button @click="$emit('set-all', false)">Снять все</button>
        </div>
      </div>
    </div>
  `,
};

/* ---------- Orders table ---------- */

const OrdersTable = {
  props: { rows: Array, allDeliveredRows: Array, sortKey: String, sortDir: String, page: Number, pageSize: Number },
  emits: ['sort', 'page-change'],
  setup(props) {
    const expandedOrder = ref(null);
    function toggleExpand(orderId) {
      expandedOrder.value = expandedOrder.value === orderId ? null : orderId;
    }

    const orders = computed(() => {
      const byOrder = new Map();
      props.rows.forEach((r) => {
        if (!byOrder.has(r.order)) {
          byOrder.set(r.order, {
            order: r.order, date: r.date, createdAt: r.createdAt, deliveredAt: r.deliveredAt,
            sum: 0, visibleItems: 0, items: [],
          });
        }
        const o = byOrder.get(r.order);
        o.sum += r.sum;
        o.visibleItems += 1;
        o.items.push(r);
      });
      const totalItemsByOrder = new Map();
      props.allDeliveredRows.forEach((r) => {
        totalItemsByOrder.set(r.order, (totalItemsByOrder.get(r.order) || 0) + 1);
      });
      const list = Array.from(byOrder.values()).map((o) => ({
        ...o,
        totalItems: totalItemsByOrder.get(o.order) || o.visibleItems,
      }));
      return list;
    });

    const sorted = computed(() => {
      const key = props.sortKey, dir = props.sortDir === 'asc' ? 1 : -1;
      return orders.value.slice().sort((a, b) => {
        if (a[key] < b[key]) return -1 * dir;
        if (a[key] > b[key]) return 1 * dir;
        return 0;
      });
    });

    const totalPages = computed(() => Math.max(1, Math.ceil(sorted.value.length / props.pageSize)));
    const pageRows = computed(() => {
      const start = (props.page - 1) * props.pageSize;
      return sorted.value.slice(start, start + props.pageSize);
    });

    return { sorted, totalPages, pageRows, fmtMoney, expandedOrder, toggleExpand };
  },
  template: `
    <div>
      <div v-if="sorted.length === 0" class="empty-state">Нет заказов для текущего фильтра</div>
      <template v-else>
        <table class="orders-table">
          <thead>
            <tr>
              <th style="width:20px;"></th>
              <th @click="$emit('sort', 'order')" :class="{ sorted: sortKey === 'order' }">Номер заказа</th>
              <th @click="$emit('sort', 'date')" :class="{ sorted: sortKey === 'date' }">Дата</th>
              <th>Статус</th>
              <th @click="$emit('sort', 'createdAt')" :class="{ sorted: sortKey === 'createdAt' }">Создан</th>
              <th @click="$emit('sort', 'deliveredAt')" :class="{ sorted: sortKey === 'deliveredAt' }">Доставлен</th>
              <th @click="$emit('sort', 'sum')" :class="{ sorted: sortKey === 'sum' }">Сумма</th>
            </tr>
          </thead>
          <tbody>
            <template v-for="o in pageRows" :key="o.order">
              <tr class="order-row" @click="toggleExpand(o.order)">
                <td class="expand-caret" :class="{ open: expandedOrder === o.order }">▸</td>
                <td>{{ o.order }}</td>
                <td>{{ o.date }}</td>
                <td><span class="status-badge">доставлен</span></td>
                <td>{{ o.createdAt || '—' }}</td>
                <td>{{ o.deliveredAt || '—' }}</td>
                <td>
                  {{ fmtMoney(o.sum) }}
                  <div v-if="o.visibleItems < o.totalItems" class="partial-note">{{ o.visibleItems }} из {{ o.totalItems }} позиций</div>
                </td>
              </tr>
              <tr v-if="expandedOrder === o.order" class="order-detail-row">
                <td colspan="7">
                  <table class="order-items-table">
                    <thead>
                      <tr>
                        <th>Позиция</th><th>Категория</th><th>Цена</th><th>Скидка</th><th>Кол-во</th><th>Сумма</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr v-for="(item, idx) in o.items" :key="idx">
                        <td>{{ item.name }}</td>
                        <td>{{ item.category }}</td>
                        <td>{{ fmtMoney(item.priceFinal) }}</td>
                        <td>{{ item.discount > 0 ? '−' + fmtMoney(item.discount) : '—' }}</td>
                        <td>{{ item.qty }}</td>
                        <td>{{ fmtMoney(item.sum) }}</td>
                      </tr>
                    </tbody>
                  </table>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
        <div class="table-footer">
          <div>Всего заказов: {{ sorted.length }}</div>
          <div class="table-pager">
            <button :disabled="page <= 1" @click="$emit('page-change', page - 1)">← Назад</button>
            <span>{{ page }} / {{ totalPages }}</span>
            <button :disabled="page >= totalPages" @click="$emit('page-change', page + 1)">Вперёд →</button>
          </div>
        </div>
      </template>
    </div>
  `,
};

/* ---------- Floating tooltip (shared) ---------- */

function useTooltipService() {
  const visible = ref(false);
  const x = ref(0);
  const y = ref(0);
  const text = ref('');
  function show(clientX, clientY, t) {
    visible.value = true;
    x.value = clientX + 14;
    y.value = clientY + 14;
    text.value = t;
  }
  function hide() { visible.value = false; }
  return { visible, x, y, text, show, hide };
}

const FloatingTooltip = {
  props: { visible: Boolean, x: Number, y: Number, text: String },
  template: `
    <div v-if="visible" class="floating-tooltip" :style="{ left: x + 'px', top: y + 'px' }">{{ text }}</div>
  `,
};

/* ---------- Root App ---------- */

const App = {
  components: { KpiCards, DateRangeFilter, CategoryFilterPopover, CategoryBarChart, TopProducts, StreamGraph, YoyChart, OrdersTable, FloatingTooltip },
  setup() {
    const store = createStore();
    const { kpis } = useKpis(store);
    const tooltip = useTooltipService();
    provide('tooltip', tooltip);

    function onDateRangeChange(range) {
      store.state.dateRange = range;
      store.state.table.page = 1;
    }

    function toggleCategory(cat) {
      store.toggleCategory(cat);
      store.state.table.page = 1;
    }
    function setAllCategories(on) {
      store.setAllCategories(on);
      store.state.table.page = 1;
    }

    function onSort(key) {
      if (store.state.table.sortKey === key) {
        store.state.table.sortDir = store.state.table.sortDir === 'asc' ? 'desc' : 'asc';
      } else {
        store.state.table.sortKey = key;
        store.state.table.sortDir = 'desc';
      }
    }
    function onPageChange(p) { store.state.table.page = p; }

    return {
      store, kpis, tooltip,
      onDateRangeChange,
      toggleCategory, setAllCategories,
      onSort, onPageChange,
      fmtMoney, fmtNum,
    };
  },
  template: `
    <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:16px;">
      <div>
        <h1 class="dash-title">Дашборд заказов</h1>
      </div>
      <div style="display:flex; gap:12px; flex-wrap:wrap;">
        <div>
          <div style="font-size:11px; color:var(--text-muted); margin-bottom:4px;">Дата заказа</div>
          <date-range-filter
            :date-range="store.state.dateRange"
            :full-range="store.fullRange"
            @change="onDateRangeChange"
          ></date-range-filter>
        </div>
        <div>
          <div style="font-size:11px; color:var(--text-muted); margin-bottom:4px;">Категории</div>
          <category-filter-popover
            :date-filtered-rows="store.filteredRows.value"
            :selected-categories="store.state.selectedCategories"
            @toggle-category="toggleCategory"
            @set-all="setAllCategories"
          ></category-filter-popover>
        </div>
      </div>
    </div>

    <kpi-cards :kpis="kpis"></kpi-cards>

    <div class="panel" style="margin-bottom:16px;">
      <div class="panel-title">
        Категории
        <div style="margin-left:auto; display:flex; align-items:center; gap:10px;">
          <span class="hint">можно нажимать на категорию, чтобы включить/выключить её в остальных графиках</span>
          <div class="toggle-group">
            <button :class="{ active: store.state.barChartMetric === 'sum' }" @click="store.state.barChartMetric = 'sum'">₽</button>
            <button :class="{ active: store.state.barChartMetric === 'qty' }" @click="store.state.barChartMetric = 'qty'">шт</button>
          </div>
        </div>
      </div>
      <category-bar-chart
        :date-filtered-rows="store.filteredRows.value"
        :selected-categories="store.state.selectedCategories"
        :metric="store.state.barChartMetric"
        @toggle-category="toggleCategory"
      ></category-bar-chart>
    </div>

    <div class="grid secondary-grid">
      <div class="panel">
        <div class="panel-title">
          Стримграф трат по категориям
          <span class="hint">наведите на график для разбивки по месяцу</span>
        </div>
        <stream-graph
          :rows="store.filteredRows.value"
          :selected-categories="store.state.selectedCategories"
        ></stream-graph>
      </div>
      <div class="panel">
        <div class="panel-title">
          Топ-10 товаров
          <div class="toggle-group">
            <button :class="{ active: store.state.topProductsMetric === 'sum' }" @click="store.state.topProductsMetric = 'sum'">₽</button>
            <button :class="{ active: store.state.topProductsMetric === 'qty' }" @click="store.state.topProductsMetric = 'qty'">шт</button>
          </div>
        </div>
        <top-products :rows="store.filteredRows.value" :metric="store.state.topProductsMetric"></top-products>
      </div>
    </div>

    <div class="panel" style="margin-bottom:16px;">
      <div class="panel-title">Сравнение трат год-к-году</div>
      <yoy-chart
        :rows="store.categoryFilteredRows.value"
        :year-a="store.state.yoyYearA"
        :year-b="store.state.yoyYearB"
        :available-years="store.availableYears.value"
        @update:yearA="store.state.yoyYearA = $event"
        @update:yearB="store.state.yoyYearB = $event"
      ></yoy-chart>
    </div>

    <div class="panel">
      <div class="panel-title">Таблица заказов</div>
      <orders-table
        :rows="store.filteredRows.value"
        :all-delivered-rows="store.deliveredRows.value"
        :sort-key="store.state.table.sortKey"
        :sort-dir="store.state.table.sortDir"
        :page="store.state.table.page"
        :page-size="store.state.table.pageSize"
        @sort="onSort"
        @page-change="onPageChange"
      ></orders-table>
    </div>

    <floating-tooltip :visible="tooltip.visible.value" :x="tooltip.x.value" :y="tooltip.y.value" :text="tooltip.text.value"></floating-tooltip>
  `,
};

createApp(App).mount('#app');

</script>
</body>
</html>
